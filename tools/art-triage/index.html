<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Triage</title>
<style>
  :root {
    --bg: #1c1a18; --panel: #22201d; --border: #34302b; --text: #e6dfd5;
    --muted: #a69e93; --accent: #e1916f; --gold: #e5bb68; --trash: #b85c5c; --find: #6f9fb8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, system-ui, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; align-items: baseline; }
  header h1 { margin: 0; font-size: 18px; color: var(--gold); }
  header .hint { color: var(--muted); font-size: 12px; }
  header .saved { margin-left: auto; color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 1fr 300px; height: calc(100vh - 57px); }
  main { overflow-y: auto; padding: 8px 24px 48px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 24px 0 10px; }
  h2 span { color: var(--text); }

  .matched { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .group { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
  .group.in-trash { opacity: .35; }
  .group .title { font-weight: 600; margin-bottom: 2px; }
  .group .meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .group .meta a { color: var(--accent); }
  .group .thumbs { display: flex; gap: 6px; overflow-x: auto; }
  .group .thumbs img { height: 110px; border-radius: 3px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .tile { position: relative; aspect-ratio: 4 / 3; background: #111; border-radius: 4px; overflow: hidden; cursor: grab; border: 2px solid transparent; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .tile .size { position: absolute; bottom: 3px; left: 4px; font-size: 10px; color: #fff; background: rgb(0 0 0 / .55); padding: 0 4px; border-radius: 2px; }
  .tile:hover { border-color: var(--accent); }
  .has-comment::after {
    content: "✎"; position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--gold); color: #1c1a18; font-size: 12px; display: grid; place-items: center;
  }
  .group.has-comment { position: relative; }

  aside { border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  .zone { flex: 1; display: flex; flex-direction: column; border-bottom: 1px solid var(--border); min-height: 0; }
  .zone .head { padding: 12px 16px; font-weight: 600; display: flex; justify-content: space-between; }
  .zone.trash .head { color: var(--trash); }
  .zone.find .head { color: var(--find); }
  .zone .drop { flex: 1; margin: 0 12px 12px; border: 2px dashed var(--border); border-radius: 6px; padding: 6px; overflow-y: auto;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; align-content: start; }
  .zone .drop.over { border-color: var(--accent); background: rgb(225 145 111 / .08); }
  .zone .drop .tile { aspect-ratio: 1; }
  .zone .empty { grid-column: 1 / -1; color: var(--muted); font-size: 12px; text-align: center; padding: 24px 8px; }
  #unsorted.over { outline: 2px dashed var(--accent); outline-offset: 6px; border-radius: 6px; }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; width: min(560px, 92vw); padding: 16px; }
  dialog::backdrop { background: rgb(0 0 0 / .6); }
  dialog img { max-width: 100%; max-height: 260px; display: block; margin: 0 auto 12px; border-radius: 4px; }
  dialog .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; word-break: break-all; }
  dialog textarea { width: 100%; min-height: 90px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 8px; font: inherit; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  button { background: var(--border); color: var(--text); border: 0; border-radius: 4px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #1c1a18; }
  #lightbox { width: auto; max-width: 92vw; padding: 8px; }
  #lightbox img { max-height: 86vh; max-width: 90vw; margin: 0; }
</style>
</head>
<body>
<header>
  <h1>Art Triage</h1>
  <span class="hint">Drag images to Trash or Find · right-click to comment · double-click to enlarge · drag back to Unsorted to undo</span>
  <span class="saved" id="saved"></span>
</header>
<div class="layout">
  <main>
    <h2>Matched <span id="matched-count"></span></h2>
    <div class="matched" id="matched"></div>
    <h2>Unsorted <span id="unsorted-count"></span></h2>
    <div class="grid" id="unsorted"></div>
  </main>
  <aside>
    <div class="zone trash"><div class="head">Trash <span id="trash-count"></span></div><div class="drop" data-bin="trash"></div></div>
    <div class="zone find"><div class="head">Find <span id="find-count"></span></div><div class="drop" data-bin="find"></div></div>
  </aside>
</div>

<dialog id="comment">
  <img id="comment-img" alt="">
  <div class="label" id="comment-label"></div>
  <textarea id="comment-text" placeholder="e.g. I think this is called … let's use it / just use this png as is"></textarea>
  <div class="row"><button id="comment-cancel">Cancel</button><button class="primary" id="comment-save">Save</button></div>
</dialog>
<dialog id="lightbox"><img id="lightbox-img" alt=""></dialog>

<script>
const img = (p) => `/img?p=${encodeURIComponent(p)}`;
let catalog, state, matchedFiles;

async function load() {
  catalog = await (await fetch("catalog.json")).json();
  state = (await (await fetch("/state")).json()) ?? { bins: {}, comments: {} };
  // Seed decisions made in chat (only for items not already touched)
  for (const [p, v] of Object.entries(catalog.initial ?? {})) {
    if (!(p in state.bins)) state.bins[p] = v.bin;
    if (v.comment && !(p in state.comments)) state.comments[p] = v.comment;
  }
  matchedFiles = new Set(catalog.matched.flatMap((g) => g.files));
  render();
}

let saveTimer;
function save() {
  document.getElementById("saved").textContent = "Saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await fetch("/state", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) });
    document.getElementById("saved").textContent = "Saved to triage.json";
  }, 300);
}

function tile(p) {
  const el = document.createElement("div");
  el.className = "tile";
  el.draggable = true;
  el.dataset.path = p;
  el.title = state.comments[p] ? `${p}\n\n“${state.comments[p]}”` : p;
  if (state.comments[p]) el.classList.add("has-comment");
  const im = document.createElement("img");
  im.loading = "lazy";
  im.src = img(p);
  im.onload = () => { const s = document.createElement("span"); s.className = "size"; s.textContent = `${im.naturalWidth}×${im.naturalHeight}`; el.append(s); };
  el.append(im);
  el.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", p));
  el.addEventListener("contextmenu", (e) => { e.preventDefault(); openComment(p, p, img(p)); });
  el.addEventListener("dblclick", () => { document.getElementById("lightbox-img").src = img(p); document.getElementById("lightbox").showModal(); });
  return el;
}

function render() {
  const matched = document.getElementById("matched");
  matched.replaceChildren(...catalog.matched.map((g) => {
    const key = `group:${g.title}`;
    const el = document.createElement("div");
    el.className = "group";
    if (g.files.every((f) => state.bins[f] === "trash")) el.classList.add("in-trash");
    if (state.comments[key]) { el.classList.add("has-comment"); el.title = `“${state.comments[key]}”`; }
    el.innerHTML = `<div class="title"></div><div class="meta"></div><div class="thumbs"></div>`;
    el.querySelector(".title").textContent = g.title;
    el.querySelector(".meta").innerHTML = g.original
      ? `Original ${g.originalRes} · <a href="${g.original}" target="_blank" rel="noopener">open</a> · your copy is lower-res`
      : "No original found yet";
    for (const f of g.files) {
      const im = document.createElement("img");
      im.loading = "lazy"; im.src = img(f); im.draggable = true; im.title = f;
      im.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", f));
      im.addEventListener("dblclick", () => { document.getElementById("lightbox-img").src = img(f); document.getElementById("lightbox").showModal(); });
      el.querySelector(".thumbs").append(im);
    }
    el.addEventListener("contextmenu", (e) => { e.preventDefault(); openComment(key, g.title, img(g.files[0])); });
    return el;
  }));
  document.getElementById("matched-count").textContent = catalog.matched.length;

  const unsorted = catalog.all.filter((p) => !matchedFiles.has(p) && !state.bins[p]);
  document.getElementById("unsorted").replaceChildren(...unsorted.map(tile));
  document.getElementById("unsorted-count").textContent = unsorted.length;

  for (const drop of document.querySelectorAll(".drop")) {
    const bin = drop.dataset.bin;
    const items = catalog.all.filter((p) => state.bins[p] === bin);
    drop.replaceChildren(...(items.length ? items.map(tile) : [Object.assign(document.createElement("div"), {
      className: "empty", textContent: bin === "trash" ? "Drop images you don't want" : "Drop images to track down — you'll be asked for a note",
    })]));
    document.getElementById(`${bin}-count`).textContent = items.length || "";
  }
}

function makeDropTarget(el, bin) {
  el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", (e) => {
    e.preventDefault(); el.classList.remove("over");
    const p = e.dataTransfer.getData("text/plain");
    if (!p) return;
    if (bin) state.bins[p] = bin; else delete state.bins[p];
    save(); render();
    if (bin === "find") openComment(p, p, img(p));
  });
}
document.querySelectorAll(".drop").forEach((d) => makeDropTarget(d, d.dataset.bin));
makeDropTarget(document.getElementById("unsorted"), null);

let commentKey = null;
function openComment(key, label, src) {
  commentKey = key;
  document.getElementById("comment-img").src = src;
  document.getElementById("comment-label").textContent = label;
  document.getElementById("comment-text").value = state.comments[key] ?? "";
  document.getElementById("comment").showModal();
  document.getElementById("comment-text").focus();
}
document.getElementById("comment-save").onclick = () => {
  const v = document.getElementById("comment-text").value.trim();
  if (v) state.comments[commentKey] = v; else delete state.comments[commentKey];
  document.getElementById("comment").close(); save(); render();
};
document.getElementById("comment-cancel").onclick = () => document.getElementById("comment").close();
document.getElementById("comment-text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) document.getElementById("comment-save").click();
});
document.getElementById("lightbox").addEventListener("click", (e) => e.currentTarget.close());

load();
</script>
</body>
</html>
